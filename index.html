<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f0e" media="(prefers-color-scheme: dark)">
<title>Health Check-In</title>
<link rel="manifest" href="manifest.webmanifest">

<main id="app" aria-live="polite"></main>

  <button data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M5 16h14"/><circle cx="9" cy="8" r="2" fill="var(--bg)"/><circle cx="15" cy="16" r="2" fill="var(--bg)"/></svg>Settings</button>

<div id="toast" role="status"></div>
<script src="db.js"></script>
<script src="stats.js"></script>
